name: Sync glucose to Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: glucose-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the LibreLinkUp client
        run: python -m pip install "pylibrelinkup @ git+https://github.com/robberwick/pylibrelinkup.git@00944c9aff47868c8c3639fe078bc5f79a052b48"
      - name: Sync readings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://mtixqgoifyajrnerguec.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LIBRELINKUP_EMAIL: ${{ secrets.LIBRELINKUP_EMAIL }}
          LIBRELINKUP_PASSWORD: ${{ secrets.LIBRELINKUP_PASSWORD }}
          LIBRELINKUP_PATIENT_ID: ${{ secrets.LIBRELINKUP_PATIENT_ID }}
        run: python sync_glucose.py
